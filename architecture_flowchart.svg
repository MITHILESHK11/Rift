<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8f9ff; }
      .box { fill: #ffffff; stroke: #c6c6cd; stroke-width: 2; rx: 8; }
      .box-highlight { fill: #eef4ff; stroke: #000000; stroke-width: 2; rx: 8; }
      .box-accent { fill: #d5e3fc; stroke: #57657a; stroke-width: 2; rx: 8; }
      .box-green { fill: #e6f4ea; stroke: #1e8e3e; stroke-width: 2; rx: 8; }
      .box-red { fill: #ffdad6; stroke: #ba1a1a; stroke-width: 2; rx: 8; }
      .text-title { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; fill: #0d1c2d; text-anchor: middle; }
      .text-sub { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 400; fill: #45464d; text-anchor: middle; }
      .text-bold { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: #000000; text-anchor: middle; }
      .text-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #515f74; text-anchor: middle; }
      .arrow { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #76777d; stroke-width: 1.5; stroke-dasharray: 4; fill: none; marker-end: url(#arrowhead-gray); }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#76777d" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect class="bg" width="1000" height="700" />

  <!-- Header Title -->
  <text x="500" y="40" class="text-title" font-size="22">Rift - Sales Inbox Router &amp; Grounded Chat Architecture Flowchart</text>
  <text x="500" y="62" class="text-sub">End-to-End Email Processing, Business Rules Triage & Anti-Hallucination Query Engine</text>

  <!-- Step 1: Input Ingestion -->
  <g transform="translate(50, 100)">
    <rect class="box-highlight" width="220" height="110" />
    <text x="110" y="32" class="text-title">1. Email Ingestion</text>
    <text x="110" y="55" class="text-sub">POST /ingest or Real Email Reader</text>
    <text x="110" y="75" class="text-mono">inbox.json (Batch Array)</text>
    <text x="110" y="93" class="text-mono">candidate_id email</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path class="arrow" d="M 270 155 L 340 155" />

  <!-- Step 2: Gemini LLM Extraction -->
  <g transform="translate(350, 100)">
    <rect class="box" width="240" height="110" />
    <text x="120" y="32" class="text-title">2. Gemini 2.5 Flash LLM</text>
    <text x="120" y="55" class="text-sub">JSON Structured Extraction</text>
    <text x="120" y="75" class="text-mono">Category, Deal Value (INR)</text>
    <text x="120" y="93" class="text-mono">Company Name & Urgency</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path class="arrow" d="M 590 155 L 660 155" />

  <!-- Step 3: Rules Engine -->
  <g transform="translate(670, 100)">
    <rect class="box-accent" width="270" height="110" />
    <text x="135" y="32" class="text-title">3. Deterministic Rules Engine</text>
    <text x="135" y="55" class="text-sub">Overrides & Priority Assignment</text>
    <text x="135" y="75" class="text-mono">Rule 1: PSU/Govt Override -> u_aarti</text>
    <text x="135" y="93" class="text-mono">Rule 2: >10L -> u_aarti | SMB -> u_rohit</text>
  </g>

  <!-- Decision Branch Arrows from Rules Engine -->
  <!-- Down to Task Store -->
  <path class="arrow" d="M 805 210 L 805 310" />
  <!-- Left to Noise Log -->
  <path class="arrow-dashed" d="M 670 180 L 570 270" />

  <!-- Rule 4 Filtered Noise Log -->
  <g transform="translate(390, 260)">
    <rect class="box-red" width="190" height="80" />
    <text x="95" y="30" class="text-title">Rule 4: Skipped Noise</text>
    <text x="95" y="50" class="text-sub">Spam / OOO / Newsletters</text>
    <text x="95" y="68" class="text-mono">No Task Created</text>
  </g>

  <!-- Step 4: Persistent Data Store (MongoDB / SQL) -->
  <g transform="translate(670, 320)">
    <rect class="box-green" width="270" height="130" />
    <text x="135" y="30" class="text-title">4. Database Storage Layer</text>
    <text x="135" y="52" class="text-sub">MongoDB / PostgreSQL / SQLite</text>
    <text x="135" y="75" class="text-mono">tasks (candidate_id scoped)</text>
    <text x="135" y="95" class="text-mono">processed_emails & thread_map</text>
    <text x="135" y="115" class="text-bold">Deduplicated by source_email_id</text>
  </g>

  <!-- Arrow Data Store -> Grounded Chat & UI -->
  <path class="arrow" d="M 670 385 L 530 385" />

  <!-- Step 5: Grounded Anti-Hallucination Query Engine -->
  <g transform="translate(230, 320)">
    <rect class="box" width="280" height="130" />
    <text x="140" y="30" class="text-title">5. Grounded Chat Query Engine</text>
    <text x="140" y="52" class="text-sub">POST /api/chat (2-Stage Execution)</text>
    <text x="140" y="75" class="text-mono">Stage 1: SQL/NoSQL Aggregation</text>
    <text x="140" y="95" class="text-mono">Stage 2: Gemini 2.5 Flash Phraser</text>
    <text x="140" y="115" class="text-bold">Returns 100% Fact-Checked Answer</text>
  </g>

  <!-- Arrow 5 -> 6 (UI) -->
  <path class="arrow" d="M 370 450 L 370 520" />

  <!-- Step 6: React Executive Precision Dashboard UI -->
  <g transform="translate(100, 530)">
    <rect class="box-highlight" width="800" height="130" />
    <text x="400" y="32" class="text-title">6. React Executive Precision UI (SalesHub)</text>
    <text x="400" y="55" class="text-sub">3-Pane Dashboard Interface</text>
    <text x="200" y="85" class="text-bold">Left Nav Sidebar</text>
    <text x="200" y="105" class="text-mono">candidate_id Badge | Navigation</text>
    <text x="440" y="85" class="text-bold">Center Triage & Task Queue</text>
    <text x="440" y="105" class="text-mono">Payload Ingestion & Filtered Table</text>
    <text x="680" y="85" class="text-bold">Right Copilot Analysis</text>
    <text x="680" y="105" class="text-mono">Grounded Chat & JSON Grounding</text>
  </g>

</svg>
