<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="icon" type="image/png" href="/rift_logo.png" />
    <title>Rift</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "on-secondary-fixed": "#0d1c2e",
              "primary-fixed-dim": "#bec6e0",
              "secondary": "#515f74",
              "on-secondary-container": "#57657a",
              "inverse-primary": "#bec6e0",
              "background": "#f8f9ff",
              "on-primary": "#ffffff",
              "primary-fixed": "#dae2fd",
              "tertiary-container": "#191c1e",
              "on-surface-variant": "#45464d",
              "surface-bright": "#f8f9ff",
              "secondary-fixed": "#d5e3fc",
              "on-error": "#ffffff",
              "surface-container": "#e5efff",
              "surface-tint": "#565e74",
              "surface-container-lowest": "#ffffff",
              "inverse-surface": "#233143",
              "outline": "#76777d",
              "secondary-container": "#d5e3fc",
              "inverse-on-surface": "#e9f1ff",
              "outline-variant": "#c6c6cd",
              "surface-container-high": "#dbe9ff",
              "on-secondary": "#ffffff",
              "on-primary-container": "#7c839b",
              "on-tertiary": "#ffffff",
              "on-background": "#0d1c2d",
              "tertiary-fixed-dim": "#c4c7c9",
              "error-container": "#ffdad6",
              "surface-variant": "#d4e4fa",
              "on-tertiary-container": "#818486",
              "on-surface": "#0d1c2d",
              "secondary-fixed-dim": "#b9c7df",
              "tertiary-fixed": "#e0e3e5",
              "on-tertiary-fixed": "#191c1e",
              "on-primary-fixed-variant": "#3f465c",
              "tertiary": "#000000",
              "surface-container-highest": "#d4e4fa",
              "error": "#ba1a1a",
              "surface": "#f8f9ff",
              "on-tertiary-fixed-variant": "#444749",
              "surface-container-low": "#eef4ff",
              "on-error-container": "#93000a",
              "surface-dim": "#ccdbf2",
              "on-primary-fixed": "#131b2e",
              "on-secondary-fixed-variant": "#3a485b",
              "primary-container": "#131b2e",
              "primary": "#000000"
            },
            "borderRadius": {
              "DEFAULT": "0.125rem",
              "lg": "0.25rem",
              "xl": "0.5rem",
              "full": "0.75rem"
            },
            "spacing": {
              "gutter": "16px",
              "base": "4px",
              "container-margin": "24px",
              "cell-padding-v": "12px",
              "cell-padding-h": "16px"
            },
            "fontFamily": {
              "body-sm": ["Inter"],
              "data-mono": ["JetBrains Mono"],
              "body-md": ["Inter"],
              "headline-md": ["Inter"],
              "headline-sm": ["Inter"],
              "display-lg": ["Inter"],
              "label-caps": ["Inter"],
              "body-lg": ["Inter"]
            },
            "fontSize": {
              "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
              "data-mono": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
              "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
              "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
              "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
              "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
              "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
              "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
            }
          }
        }
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
  </head>
  <body class="bg-background text-on-background font-body-md text-body-md h-screen overflow-hidden flex">
    <div id="root" class="w-full h-full flex"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
